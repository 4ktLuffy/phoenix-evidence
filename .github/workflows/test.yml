name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python ${{ matrix.python }} --with ruff ruff check .
      - run: uv run --python ${{ matrix.python }} --with ruff ruff format --check .
      - run: uv run --python ${{ matrix.python }} --with pytest --with pytest-xdist pytest -q
