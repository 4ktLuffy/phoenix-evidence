name: phoenix-evidence compare
description: >-
  Is the candidate experiment really better than the baseline? Paired on shared examples, every
  evaluator at once, with margins of error; the table goes to the job summary.
branding:
  icon: bar-chart-2
  color: green
inputs:
  base:
    description: Baseline experiment id (Phoenix GlobalID)
    required: true
  candidate:
    description: Candidate experiment id (Phoenix GlobalID)
    required: true
  phoenix-url:
    description: Phoenix base URL (else PHOENIX_BASE_URL from the environment)
    required: false
    default: ''
  fail-on-regression:
    description: Fail the job when a metric is shown worse after correction for multiple metrics
    required: false
    default: 'true'
  lower-is-better:
    description: Comma-separated evaluator names where a lower score is better
    required: false
    default: ''
  python-version:
    description: Python version to run with
    required: false
    default: '3.12'
outputs:
  report:
    description: Path of the JSON report (rows, regressions, improvements)
    value: ${{ steps.compare.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install phoenix-evidence
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}[phoenix]"
    - name: Compare experiments
      id: compare
      shell: bash
      env:
        PE_BASE: ${{ inputs.base }}
        PE_CANDIDATE: ${{ inputs.candidate }}
        PE_URL: ${{ inputs.phoenix-url }}
        PE_FAIL: ${{ inputs.fail-on-regression }}
        PE_LOWER: ${{ inputs.lower-is-better }}
      run: |
        report="$RUNNER_TEMP/phoenix-evidence-compare.json"
        args=(compare "$PE_BASE" "$PE_CANDIDATE" --json "$report")
        [ -n "$PE_LOWER" ] && args+=(--lower-is-better "$PE_LOWER")
        [ "$PE_FAIL" = "true" ] && args+=(--fail-on-regression)
        url=()
        [ -n "$PE_URL" ] && url=(--url "$PE_URL")
        echo "report=$report" >> "$GITHUB_OUTPUT"
        phoenix-evidence "${url[@]}" "${args[@]}"
